<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERY UP VER3</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="vu-suggest.js"></script>
  <link rel="stylesheet" href="product-table.css" />
  <script src="product-table.js"></script>
  <script src="currency-rates.js"></script>
  <style>
    /* ── 기본 리셋 & 다크 테마 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:       #0f172a;
      --bg-panel:      #1e293b;
      --bg-card:       #263045;
      --bg-input:      #0f172a;
      --border:        #334155;
      --accent:        #3b82f6;
      --accent-hover:  #2563eb;
      --accent-success:#22c55e;
      --accent-warn:   #f59e0b;
      --accent-danger: #ef4444;
      --text-primary:  #f1f5f9;
      --text-secondary:#94a3b8;
      --text-muted:    #475569;
      --inactive-bg:   #1e293b;
      --inactive-text: #334155;
      --registration-width: 380px;
      --radius:        6px;
      --transition:    0.15s ease;

      /* 테마마다 갈리는 값 — style.css 와 같은 이름·같은 뜻으로 맞춰 둔다. */
      --ovl-1: rgba(255,255,255,0.05);
      --ovl-2: rgba(255,255,255,0.10);
      --ovl-3: rgba(255,255,255,0.16);
      --sunk:  rgba(0,0,0,0.22);
      --shadow-panel: 0 8px 32px 0 rgba(0,0,0,0.37);
      --btn-face:       #111827;      /* 버튼은 검정 */
      --btn-face-hover: #000000;
      --btn-text:       #ffffff;
      --logo-tile:      #ffffff;
      /* 로그 글자. 어두운 배경용 파스텔이라 밝은 화면에서는 안 보인다 → 라이트에서 진하게. */
      --log-ok:   #86efac;
      --log-warn: #fcd34d;
      --log-err:  #fca5a5;
    }

    /* ── 라이트 테마 (기본) ── */
    :root[data-theme="light"] {
      --bg-base:        #eef2f7;
      --bg-panel:       #ffffff;
      --bg-card:        #ffffff;
      --bg-input:       #ffffff;
      --border:         #d5dbe5;
      --accent:         #2563eb;
      --accent-hover:   #1d4ed8;
      --text-primary:   #0f172a;
      --text-secondary: #52627a;
      --text-muted:     #7c8aa0;
      --inactive-bg:    #e7ecf3;
      --inactive-text:  #c3ccda;

      --ovl-1: rgba(15,23,42,0.04);
      --ovl-2: rgba(15,23,42,0.08);
      --ovl-3: rgba(15,23,42,0.16);
      --sunk:  rgba(15,23,42,0.05);
      --shadow-panel: 0 4px 16px 0 rgba(15,23,42,0.10);
      /* 밝은 배경에서는 흰 타일이 로고 경계를 지운다 → 아주 옅은 회색으로. */
      --logo-tile: #f1f4f8;
      --log-ok:   #15803d;
      --log-warn: #a16207;
      --log-err:  #b91c1c;
    }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── 앱 셸 ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── 상단 헤더 ── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    #header button, #header label, #header input {
      -webkit-app-region: no-drag;
    }

    #btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 5px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      transition: background var(--transition), color var(--transition);
    }
    #btn-back:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    #app-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-primary);
      flex: 1;
    }

    /* ── 모드 선택 ── */
    #mode-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #mode-bar span { color: var(--text-secondary); font-size: 12px; }

    .mode-radio { display: none; }
    .mode-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      transition: all var(--transition);
      user-select: none;
    }
    .mode-label .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      transition: all var(--transition);
    }
    .mode-radio:checked + .mode-label {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(59,130,246,0.08);
    }
    .mode-radio:checked + .mode-label .dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ── 메인 (좌우 분할) ── */
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── SECTION 7 (좌측) ── */
    #section7 {
      width: var(--registration-width);
      min-height: 0;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 14px 16px;
      gap: 12px;
    }
    #section7 > * { flex-shrink: 0; }
    #section7::-webkit-scrollbar { width: 10px; }
    #section7::-webkit-scrollbar-track { background: var(--bg-panel); }
    #section7::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border: 2px solid var(--bg-panel);
      border-radius: 5px;
    }
    #section7::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* 입력 폼 */
    /* 2단 그리드. 입력칸을 50% 로 줄이면 칸 오른쪽 절반이 빈 공간으로 남으므로,
       폭을 줄이는 대신 짧은 입력을 두 개씩 한 줄에 둔다. */
    .field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      align-items: start;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    /* 선택지가 길거나 여러 줄인 항목은 한 줄을 다 쓴다. */
    .field.wide { grid-column: 1 / -1; }
    .field label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
      line-height: 1.2;
    }
    .field input, .field textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius);
      padding: 6px 9px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color var(--transition);
      width: 100%;
      max-width: 100%;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--accent);
    }
    .field textarea {
      resize: vertical;
      min-height: 60px;
      height: auto;
      font-family: inherit;
      width: 100%;
      max-width: 100%;
    }

    /* 언어별 표기 칸. 체크된 나라가 하나뿐이면 한 칸, 셋이면 세 칸이 된다. */
    .lang-row { display: flex; gap: 6px; }
    .lang-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lang-col[hidden] { display: none; }
    .lang-tag {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    /* 칸이 하나뿐일 땐 언어 꼬리표가 군더더기다. */
    .lang-row.single .lang-tag { display: none; }

    /* 쇼핑몰별 칸. 현황판에서 그 몰을 켰을 때만 보인다(updateMallFields). 꼬리표는 이 칸을 쓰는
       몰 가운데 지금 켜진 것이다. [hidden] 이 .field 의 display:flex 에 지지 않게 못 박는다. */
    .mall-field[hidden] { display: none !important; }
    .mall-tags {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
      white-space: nowrap;
    }
    /* 꼬리표가 길면 라벨이 두 줄이 된다('변경 판매가 (USD) · 아마존 미국 · 이베이'). 같은 줄 옆 칸과 입력칸
       높이가 어긋나지 않게 칸을 줄 높이로 늘리고 입력칸을 아래에 붙인다. */
    .field-group > .mall-field { align-self: stretch; justify-content: space-between; }

    /* 라디오·체크박스 */
    .field input[type="radio"],
    .field input[type="checkbox"] {
      width: auto;
      max-width: none;
      height: auto;
      flex: none;
      margin: 0;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      accent-color: var(--accent);
    }

    /* BSA 여부 · 차량 종류 — 선택지를 한 줄에 나란히 둔다. */
    .bsa-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      padding: 2px 0;
    }
    .field .bsa-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      cursor: pointer;
    }

    /* 최근 사진 버튼 */
    .load-photo-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      transition: all var(--transition);
    }
    .load-photo-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    /* 사진 미리보기 */
    #photo-preview img {
      max-width: 100%; max-height: 150px;
      border-radius: var(--radius); border: 1px solid var(--border);
    }

    /* ── 현황판 ── */
    .board-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .board-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      order: 1;                  /* 구분선을 빠른 선택 칩 앞으로 — 칩이 줄 오른쪽 끝에 붙는다 */
    }
    /* 현황판 빠른 선택. 누르면 그 조합으로 '바꾼다'(더하지 않는다). 지금 선택과 같은 칩이 켜진다. */
    .board-presets {
      order: 2;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .board-preset {
      padding: 1px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.6;
      cursor: pointer;
      transition: all var(--transition);
    }
    .board-preset:hover { border-color: var(--accent); color: var(--text-primary); }
    .board-preset[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    #status-board {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    #status-board thead th {
      padding: 5px 2px;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      font-size: 10px;
    }
    #status-board thead th:first-child { text-align: left; }

    #status-board tbody tr {
      border-top: 1px solid var(--border);
      transition: background var(--transition);
    }
    #status-board tbody tr:hover { background: var(--ovl-1); }
    #status-board tbody tr.row-checked {
      border-left: 3px solid var(--accent);
    }

    #status-board td {
      padding: 4px 2px;
      text-align: center;
      vertical-align: middle;
    }
    #status-board td.country-cell {
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-secondary);
      padding-left: 2px;
      white-space: nowrap;
    }
    #status-board .country-cell-inner {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    #status-board .country-flag {
      height: 15px;
      width: auto;
      border-radius: 1px;
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    /* 활성 셀 */
    .platform-cell {
      cursor: pointer;
      user-select: none;
    }
    .platform-cell .cell-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 2px;
      border-radius: 5px;
      border: 1px solid transparent;
      outline: none;
      transition: background var(--transition), border-color var(--transition);
    }
    .platform-cell:hover .cell-inner { background: rgba(59,130,246,0.1); }
    /* 선택 = 눌린 타일. 체크박스를 없앤 자리를 색·테두리·안쪽 그림자가 대신한다. */
    .platform-cell .cell-inner.checked {
      background: rgba(59,130,246,0.18);
      border-color: var(--accent);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.45);
    }
    .platform-cell .cell-inner:focus-visible { border-color: var(--accent); }
    /* 쇼핑몰은 이름 대신 로고로 보여준다. 로고 파일이 아직 없는 몰만 이름으로 남는다.
       ⚠ 밝은 타일을 꼭 깔아야 한다 — 아임웹 로고는 평균 밝기 15/255 의 사실상 검정이라
       어두운 배경에 그냥 올리면 아무것도 안 보인다. 브랜드 색은 건드리지 않는 방법이다. */
    .platform-cell .plat-logo {
      height: 22px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      background: var(--logo-tile);
      border-radius: 4px;
      padding: 1px;
      box-sizing: border-box;
      /* 안 고른 몰은 흑백. 고른 몰만 브랜드 색이 살아나 한눈에 갈린다. */
      filter: grayscale(1);
      opacity: 0.45;
      transition: opacity var(--transition), filter var(--transition);
    }
    .platform-cell:hover .plat-logo { opacity: 0.75; }
    .platform-cell .cell-inner.checked .plat-logo { filter: none; opacity: 1; }

    .platform-cell .plat-name {
      font-size: 9px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .platform-cell .cell-inner.checked .plat-name { color: var(--accent); }
    /* 지금 오른쪽 폼에 열린 몰. 가운데 쇼핑몰 탭의 '활성' 표시를 현황판 칸으로 합쳤다(markViewingCells).
       켜진 칸에만 보인다 — 꺼진 칸은 폼이 없다. */
    .platform-cell.viewing .cell-inner.checked {
      background: var(--accent);
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.35);
    }
    .platform-cell.viewing .cell-inner.checked .plat-name { color: #fff; }

    /* 비활성 셀 */
    .inactive-cell {
      background: var(--inactive-bg);
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── 판매자 콘솔 아이콘 버튼 ── */
    .console-btn {
      width: 30px; height: 30px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--ovl-3);
      background: var(--ovl-1);
      cursor: pointer;
      transition: background var(--transition);
    }
    .console-btn:hover { background: var(--ovl-3); }
    .console-btn img {
      width: 20px; height: 20px;
      object-fit: contain;
      background: var(--logo-tile);
      border-radius: 4px;
      padding: 1px;
      box-sizing: border-box;
    }
    /* 로고 PNG 가 없는 몰(ESM)은 글자 타일로 대신한다. */
    .console-btn .console-txt {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px;
      background: var(--logo-tile); color: #111;
      border-radius: 4px;
      font-size: 8px; font-weight: 700; letter-spacing: -0.02em;
    }

    /* ── 실행 버튼 ── */
    #btn-run {
      width: 100%;
      padding: 9px;
      background: var(--btn-face);
      color: var(--btn-text);
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform 0.05s;
      letter-spacing: 0.04em;
    }
    #btn-run:hover { background: var(--accent-hover); }
    #btn-run:active { transform: scale(0.98); }
    #btn-run:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ── 일괄 등록 · 일괄 수정 버튼 ── */
    #btn-bulk-register, #btn-bulk-edit {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #btn-bulk-register:hover {
      background: linear-gradient(135deg, #1d4ed8, #6d28d9);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }
    #btn-bulk-register:active, #btn-bulk-edit:active { transform: translateY(0); }
    #btn-bulk-register:disabled, #btn-bulk-edit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    /* 수정은 등록과 색을 달리한다 — 모드가 바뀌어도 같은 자리라 눌러 놓고 헷갈리지 않게. */
    #btn-bulk-edit {
      background: linear-gradient(135deg, #059669, #0d9488);
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.35);
    }
    #btn-bulk-edit:hover {
      background: linear-gradient(135deg, #047857, #0f766e);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.45);
    }

    /* Keep the toggle outside the animated/reordered sidebar in both states. */
    .detail-toggle-footer {
      flex: 0 0 auto;
      padding: 8px 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }
    .detail-toggle-footer .detail-toggle-btn {
      width: 120px;
      margin-left: 8px;          /* 펼침·접힘 모두 왼쪽 끝 — 누르는 자리가 안 움직인다 */
    }
    .detail-toggle-btn {
      width: 100%;
      padding: 7px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--ovl-1);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all var(--transition);
    }
    .detail-toggle-btn:hover {
      background: var(--ovl-2);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* ── SECTION 8 (우측 — 자세히 보기) ── */
    #section8 {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 380px;
    }
    /* 접힘 — 기본 화면. 현황판(왼쪽 입력판)만 남기고 쇼핑몰 탭·신규등록 패널을 숨긴다.
       '열기' 를 눌러야 둘이 보인다(setPanels). 창 폭도 같이 줄여 빈 자리를 남기지 않는다.
       inert 는 걸지 않는다 — 숨은 폼(iframe)에서 일괄 등록이 돈다. display:none 만으로도
       포커스·스크린리더에서 빠진다. */
    #app.panels-collapsed #section8 { display: none !important; }

    #section8-body {
      flex: 1;
      min-height: 0;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
    }
    /* 왼쪽 = 로그·폼·카드, 오른쪽 = 이미지 목록(신규 등록에서만). 스크롤은 칸마다 따로 한다. */
    #section8-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── 로그 윈도우 ── */
    #log-window {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 200px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .log-entry .log-time {
      color: var(--text-muted);
      font-size: 10px;
      white-space: nowrap;
      padding-top: 1px;
      min-width: 52px;
    }
    .log-entry .log-icon { font-size: 12px; line-height: 1.4; }
    .log-entry .log-msg { flex: 1; line-height: 1.5; }

    .log-entry.info  { background: rgba(59,130,246,0.06); color: var(--text-primary); }
    .log-entry.ok    { background: rgba(34,197,94,0.07);  color: var(--log-ok); }
    .log-entry.warn  { background: rgba(245,158,11,0.07); color: var(--log-warn); }
    .log-entry.error { background: rgba(239,68,68,0.08);  color: var(--log-err); }

    /* ── 상품 수정 카드 ── */
    .product-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      animation: fadeIn 0.25s ease;
    }
    .product-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .product-card-header .platform-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(59,130,246,0.15);
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .product-card-header .card-title {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .product-card-header .card-status {
      font-size: 10px;
      color: var(--text-muted);
    }

    .product-card-body { padding: 10px 12px; }

    .searching-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-results { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

    .result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg-input);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
    }
    .result-item:hover { border-color: var(--accent); background: rgba(59,130,246,0.06); }
    .result-item.selected { border-color: var(--accent); background: rgba(59,130,246,0.1); }

    .result-item .result-thumb {
      width: 36px; height: 36px;
      object-fit: cover;
      border-radius: 3px;
      background: var(--bg-card);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .result-item .result-info { flex: 1; }
    .result-item .result-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .result-item .result-id { font-size: 10px; color: var(--text-muted); }

    .edit-form {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .edit-form .field input, .edit-form .field textarea {
      font-size: 12px;
    }
    .edit-form-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-sm {
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-secondary);
    }
    .btn-ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 14px 0;
    }

    /* 일괄 수정 결과 카드 — 수정 모드에서는 로그창이 숨어 있어 결과를 여기에 적는다. */
    .bulk-edit-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .bulk-edit-rows li { font-size: 12px; line-height: 1.5; padding: 4px 8px; border-radius: 4px; overflow-wrap: anywhere; }
    .bulk-edit-rows li.info  { background: rgba(59,130,246,0.06); color: var(--text-primary); }
    .bulk-edit-rows li.ok    { background: rgba(34,197,94,0.07);  color: var(--log-ok); }
    .bulk-edit-rows li.warn  { background: rgba(245,158,11,0.07); color: var(--log-warn); }
    .bulk-edit-rows li.error { background: rgba(239,68,68,0.08);  color: var(--log-err); }

    /* ── 스크롤바 ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* 빈 상태 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
      opacity: 0.6;
    }
    .empty-state .empty-icon { font-size: 36px; }
  </style>
  <link rel="stylesheet" href="image-library.css" />
  <link rel="stylesheet" href="bulk-edit.css" />
  <link rel="stylesheet" href="image-gallery.css" />
  <link rel="stylesheet" href="fx-auto-price.css" />
</head>
<body>
<div id="app">

  <!-- ══ 헤더 ══ -->
  <div id="header">
    <button id="btn-back" title="런처로 돌아가기">← 런처로</button>
    <div id="app-title">VERY UP VER3</div>
    <div style="display:flex;gap:6px;margin-left:auto;-webkit-app-region:no-drag;">
      <button id="btn-theme" type="button" data-theme-toggle title="밝게 / 어둡게"
        style="width:28px;height:28px;border-radius:50%;border:none;background:var(--ovl-2);color:var(--text-secondary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;"
        onmouseover="this.style.background='var(--ovl-3)'" onmouseout="this.style.background='var(--ovl-2)'">🌙</button>
      <button onclick="require('electron').ipcRenderer.send('minimize-win')" title="최소화"
        style="width:28px;height:28px;border-radius:50%;border:none;background:var(--ovl-2);color:#94a3b8;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;"
        onmouseover="this.style.background='var(--ovl-3)'" onmouseout="this.style.background='var(--ovl-2)'">─</button>
      <button onclick="require('electron').ipcRenderer.send('close-win')" title="닫기"
        style="width:28px;height:28px;border-radius:50%;border:none;background:var(--ovl-2);color:#94a3b8;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;"
        onmouseover="this.style.background='rgba(220,50,50,0.8)';this.style.color='#fff'" onmouseout="this.style.background='var(--ovl-2)';this.style.color='#94a3b8'">✕</button>
    </div>
  </div>

  <!-- ══ 모드 선택 바 ══ -->
  <div id="mode-bar">
    <span>모드:</span>

    <input type="radio" name="mode" id="mode-new" class="mode-radio" value="new" checked />
    <label for="mode-new" class="mode-label">
      <span class="dot"></span> 신규등록
    </label>

    <input type="radio" name="mode" id="mode-edit" class="mode-radio" value="edit" />
    <label for="mode-edit" class="mode-label">
      <span class="dot"></span> 단일 상품 수정
    </label>
  </div>

  <section id="bulk-edit-workspace" hidden aria-label="상품 일괄 수정"></section>

  <!-- ══ 메인 ══ -->
  <div id="main">

    <!-- ── SECTION 7 (좌측) ── -->
    <div id="section7">
      <!-- 판매자 콘솔 — 로그인 버튼과 합쳤다. 예전에는 '네이버 로그인'(자동화 세션 준비)과
           '네이버 …'(콘솔 열기)가 따로 있었는데, 콘솔도 같은 계정으로 자동 로그인하게 된
           뒤로는 둘이 같은 일을 한다. 누르면 로그인하고 그 몰의 상품 목록까지 열어준다. -->
      <div id="login-buttons" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;">
        <span style="font-size:11px;color:var(--text-muted);margin-right:2px;">판매자 콘솔</span>
        <button type="button" class="console-btn" onclick="openSellerSite('naver')"
          title="네이버 스마트스토어 — 로그인 후 상품목록"><img src="logos/naver.png" alt="네이버" /></button>
        <button type="button" class="console-btn" onclick="openSellerSite('esm')"
          title="ESM Plus — 로그인 후 이미지 호스팅"><span class="console-txt">ESM</span></button>
        <button type="button" class="console-btn" onclick="openSellerSite('imweb')"
          title="아임웹 B2B몰 — 로그인 후 상품목록"><img src="logos/b2b.png" alt="B2B몰" /></button>
        <button type="button" class="console-btn" onclick="openSellerSite('coupang')"
          title="쿠팡 윙"><img src="logos/coupang.png" alt="쿠팡" /></button>
        <button type="button" class="console-btn" onclick="openSellerSite('amazon')"
          title="아마존 셀러센트럴 재고목록"><img src="logos/amazon.png" alt="아마존" /></button>
        <button type="button" class="console-btn" onclick="openSellerSite('ebay')"
          title="이베이 셀러허브 판매중 목록"><img src="logos/ebay.png" alt="이베이" /></button>
      </div>

      <!-- 최근 사진 불러오기 (KOREA / GLOBAL) -->
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="load-photo-btn" id="btn-load-korea">🇰🇷 KOREA 사진 불러오기</button>
        <button class="load-photo-btn" id="btn-load-global">🌐 GLOBAL 사진 불러오기</button>
      </div>
      <!-- 사진 미리보기 -->
      <div id="photo-preview" style="display:none;margin-bottom:12px;text-align:center;">
        <img id="photo-preview-img" alt="미리보기" title="오른쪽 [img] 이미지 목록에 끌어다 놓으면 대표 이미지가 됩니다" />
        <div id="photo-preview-name" style="font-size:11px;color:var(--text-secondary);margin-top:4px;"></div>
      </div>

      <!-- 현황판 -->
      <div class="board-title">현황판
        <!-- 빠른 선택 — 그 조합으로 바꾼다(더하지 않는다). 선택은 앱을 다시 켜도 남는다(saveBoardSelection). -->
        <span class="board-presets" role="group" aria-label="현황판 빠른 선택">
          <button type="button" class="board-preset" data-preset="all" aria-pressed="false" title="모든 몰 선택">전체</button>
          <button type="button" class="board-preset" data-preset="korea" aria-pressed="false" title="국내 몰만 선택 — 나머지는 끕니다">국내</button>
          <button type="button" class="board-preset" data-preset="usa" aria-pressed="false" title="미국 몰만 선택 — 나머지는 끕니다">미국</button>
          <button type="button" class="board-preset" data-preset="japan" aria-pressed="false" title="일본 몰만 선택 — 나머지는 끕니다">일본</button>
          <button type="button" class="board-preset" data-preset="none" title="모두 끄기">해제</button>
        </span>
      </div>
      <table id="status-board" style="margin-top:8px;">
        <thead>
          <tr>
            <th>나라</th>
            <th>자사몰</th>
            <th>B2B</th>
            <th>오픈1</th>
            <th>오픈2</th>
          </tr>
        </thead>
        <tbody id="board-body">
          <!-- JS로 렌더링 -->
        </tbody>
      </table>

      <!-- 상품 정보 (현황판 아래로 이동) -->
      <div class="section-title" id="product-info-title" style="margin-top:16px;">상품 정보</div>
      <div class="field-group">
        <!-- 브랜드·차종명·세대는 나라마다 표기가 다르다. 현황판에서 체크한 나라의
             언어 칸만 나타난다(updateLangFields). 한국어 칸의 id 는 예전 그대로라
             자동완성·등록 경로는 손댈 필요가 없다. -->
        <div class="field wide lang-field">
          <label for="inp-brand">브랜드</label>
          <div class="lang-row">
            <div class="lang-col" data-lang="ko">
              <span class="lang-tag">한국어</span>
              <input type="text" id="inp-brand" placeholder="예: 벤츠" />
            </div>
            <div class="lang-col" data-lang="en">
              <span class="lang-tag">English</span>
              <input type="text" id="inp-brand-en" placeholder="예: BENZ" />
            </div>
            <div class="lang-col" data-lang="ja">
              <span class="lang-tag">日本語</span>
              <input type="text" id="inp-brand-ja" placeholder="예: ベンツ" />
            </div>
          </div>
        </div>
        <div class="field wide lang-field">
          <label for="inp-carmodel">차종명</label>
          <div class="lang-row">
            <div class="lang-col" data-lang="ko">
              <span class="lang-tag">한국어</span>
              <input type="text" id="inp-carmodel" placeholder="예: E클래스" />
            </div>
            <div class="lang-col" data-lang="en">
              <span class="lang-tag">English</span>
              <input type="text" id="inp-carmodel-en" placeholder="예: E-Class" />
            </div>
            <div class="lang-col" data-lang="ja">
              <span class="lang-tag">日本語</span>
              <input type="text" id="inp-carmodel-ja" placeholder="예: Eクラス" />
            </div>
          </div>
        </div>
        <div class="field wide lang-field new-only">
          <label for="inp-gen">세대</label>
          <div class="lang-row">
            <div class="lang-col" data-lang="ko">
              <span class="lang-tag">한국어</span>
              <input type="text" id="inp-gen" placeholder="예: 1세대 전기형" />
            </div>
            <div class="lang-col" data-lang="en">
              <span class="lang-tag">English</span>
              <input type="text" id="inp-gen-en" placeholder="예: 1st gen" />
            </div>
            <div class="lang-col" data-lang="ja">
              <span class="lang-tag">日本語</span>
              <input type="text" id="inp-gen-ja" placeholder="예: 1代目" />
            </div>
          </div>
        </div>
        <div class="field new-only">
          <label for="inp-year">연식</label>
          <input type="text" id="inp-year" placeholder="예: 2020~2023" />
        </div>
        <div class="field">
          <label for="inp-code">차량코드</label>
          <input type="text" id="inp-code" placeholder="예: VU-2024-001" />
        </div>
        <div class="field">
          <label for="inp-no">상품번호</label>
          <input type="text" id="inp-no" placeholder="예: 612" />
        </div>
        <!-- ── 쇼핑몰별 필수 칸 ──
             위 언어 칸(English/日本語)처럼 현황판에서 그 몰을 켰을 때만 나타난다(updateMallFields).
             data-malls 는 이 칸을 쓰는 몰이다. 몰 탭 안에 따로 있던 칸(이베이 SKU, 아마존 Product
             Type)은 여기로 옮겼고, 탭에는 여기서 바로 들어간다(fillFrame). -->
        <!-- 이베이·아마존 SKU 와 판매가(USD). 연식·차량코드·상품번호 목록에서 차를 고르면 채워진다 — 이베이는
             이베이 상품등록 표, 아마존은 아마존에 실제로 있는 SKU(아마존 상품등록 표 + API 실측값). 같은 차라도 두 몰의
             SKU 가 다를 수 있어(3시리즈 6세대: 이베이 OBM0305N101 · 아마존 OBM0304N101) 칸을 나눴다. 확실히 이어진 것이
             없으면 비워 두고 목록에서 고른다. 수정 모드에서도 보인다 — 아마존 '불러오기' 와 이베이 SKU 조회의 열쇠다. -->
        <div class="field mall-field" data-malls="ebay imweb-us">
          <label for="inp-sku">이베이 SKU<span class="mall-tags"></span></label>
          <input type="text" id="inp-sku" placeholder="예: OBM0103N101" />
        </div>
        <div class="field mall-field" data-malls="amazon">
          <label for="inp-amz-sku">아마존 SKU<span class="mall-tags"></span></label>
          <input type="text" id="inp-amz-sku" placeholder="예: OBM0103N101" />
        </div>
        <div class="field mall-field new-only" data-malls="amazon-us ebay imweb-us">
          <label for="inp-usd">판매가 (USD)<span class="mall-tags"></span></label>
          <input type="text" id="inp-usd" inputmode="decimal" placeholder="예: 109.32" />
        </div>
        <!-- 아마존 상품 유형. 기본값은 아마존 설정에 저장된 값이다(loadAmazonProductType). -->
        <div class="field mall-field" data-malls="amazon">
          <label for="inp-amz-ptype">Product Type<span class="mall-tags"></span></label>
          <input type="text" id="inp-amz-ptype" value="AUTO_PART" placeholder="AUTO_PART 또는 VEHICLE_MIRROR" />
        </div>

<script src="image-library.js"></script>
<script src="section8-mode.js"></script>
<script>
/* ══════════════════════════════════════════════
   플랫폼 데이터
══════════════════════════════════════════════ */
const PLATFORMS = {
  KOREA: [
    { type: 'own',   name: '아임웹',    label: '자사몰',    active: true  },
    { type: 'b2b',   name: 'B2B몰',     label: 'B2B',       active: true  },
    { type: 'open1', name: '네이버', label: '네이버', active: true  },
    { type: 'open2', name: '쿠팡',   label: '쿠팡',   active: true  },
  ],
  USA: [
    { type: 'own',   name: '아임웹', label: '자사몰',    active: true  },
    { type: 'b2b',   name: '',       label: 'B2B',       active: false },
    { type: 'open1', name: '아마존', label: '오픈마켓1', active: true  },
    { type: 'open2', name: '이베이', label: '오픈마켓2', active: true  },
  ],
  JAPAN: [
    { type: 'own',   name: '아임웹',  label: '자사몰',    active: true  },
    { type: 'b2b',   name: '',        label: 'B2B',       active: false },
    { type: 'open1', name: '아마존',  label: '오픈마켓1', active: true  },
    { type: 'open2', name: '라쿠텐', label: '오픈마켓2', active: true  },
  ],
  ARAB: [
    { type: 'own',   name: '쇼피파이', label: '자사몰',    active: true  },
    { type: 'b2b',   name: '',         label: 'B2B',       active: false },
    { type: 'open1', name: '',         label: '오픈마켓1', active: false },
    { type: 'open2', name: '',         label: '오픈마켓2', active: false },
  ],
};

// 쇼핑몰 로고 매핑. 파일이 없으면 renderBoard 가 알아서 이름 표시로 되돌리므로,
// 새 로고는 이 경로에 PNG 만 넣으면 그대로 붙는다.
const PLATFORM_LOGOS = {
  '아임웹':   'logos/imweb.png',
  '네이버':   'logos/naver.png',
  '쿠팡':     'logos/coupang.png',
  '아마존':   'logos/amazon.png',
  '이베이':   'logos/ebay.png',
  'B2B몰':    'logos/b2b.png',
  '라쿠텐':   'logos/rakuten.png',
  '쇼피파이': 'logos/shopify.png',
};

// 나라별 국기 이미지 매핑
const COUNTRY_FLAGS = {
  KOREA: 'flags/korea.png',
  USA:   'flags/usa.png',
  JAPAN: 'flags/japan.png',
  ARAB:  'flags/arab.png',
};

const TYPE_ORDER = ['own', 'b2b', 'open1', 'open2'];

// 플랫폼명 → index.html 탭 ID 매핑
const NAME_TO_TAB = {
  '아임웹': 'imwebBoardTab',
  'B2B몰': 'imwebTab',
  '네이버': 'naverTab',
  '쿠팡': 'coupangTab',
  '이베이': 'ebayTab',
  '아마존': 'amazonTab'
};

/* ══════════════════════════════════════════════
   상태
══════════════════════════════════════════════ */
let currentMode = 'new'; // 'new' | 'edit'
let modeRevision = 0;

// checked[country][type] = boolean
const checked = {};
Object.keys(PLATFORMS).forEach(country => {
  checked[country] = {};
  PLATFORMS[country].forEach(p => { checked[country][p.type] = false; });
});

/* ══════════════════════════════════════════════
   IPC 헬퍼 (Electron 환경 아닐 때 fallback)
══════════════════════════════════════════════ */
const ipc = (() => {
  if (window.require) {
    try { return window.require('electron').ipcRenderer; } catch(e) {}
  }
  // 개발용 stub
  return {
    send: (ch, ...args) => console.log('[IPC send]', ch, ...args),
    invoke: async (ch, ...args) => {
      console.log('[IPC invoke]', ch, ...args);
      await new Promise(r => setTimeout(r, 800));
      // 검색 결과 더미 데이터 반환 (개발용)
      if (ch === 'veryup-search-product') {
        return {
          items: [
            { id: 'PROD-001', name: '샘플 상품 A', price: '29000', stock: '100', description: '샘플 설명 A' },
            { id: 'PROD-002', name: '샘플 상품 B', price: '45000', stock: '50',  description: '샘플 설명 B' },
          ]
        };
      }
      return { ok: true, stub: true };
    },
    on: (ch, fn) => {},
  };
})();

/* ══════════════════════════════════════════════
   차량 카탈로그 (브랜드 → 국적 역인덱스)

   iframe 등록 폼의 브랜드/차종 select는 국산차·수입차 트리로 나뉘어 있는데
   좌측 상품정보 폼에는 국적 입력이 없다. 두 트리의 브랜드 키는 교집합이
   없으므로 브랜드명만으로 국적을 되찾을 수 있다.
══════════════════════════════════════════════ */
let vuCategories = null;
let vuNationalityOf = () => null;

// 이륜차 브랜드 판정은 vu-suggest.js 가 소유한다(모듈이 없으면 전부 false).
const isBikeBrand = b => !!(window.VUSuggest && window.VUSuggest.isBikeBrand(b));

async function loadVuCategories() {
  try {
    const res = await ipc.invoke('imweb-load-categories');
    if (!res || !res.success || !res.categories) return;
    vuCategories = res.categories;
    const idx = {};
    Object.keys(vuCategories).forEach(nat => {
      Object.keys(vuCategories[nat] || {}).forEach(b => { idx[b] = nat; });
    });
    vuNationalityOf = b => idx[String(b || '').trim()] || null;
    // 같은 데이터를 자동완성 모듈에 넘겨 브랜드·차종 목록을 만든다.
    if (window.VUSuggest) {
      window.VUSuggest.setCatalog(vuCategories);
      window.VUSuggest.bindShell(document);   // 이미 바인딩됐으면 목록만 갱신된다
    }
  } catch (e) {
    // 오프라인·테스트 스텁 환경에서는 조용히 넘어간다(자동 주입만 생략됨).
  }
}
// 차량 명칭 한↔영↔일 사전. 일본몰·아마존 JP 폼에 일본어를 채우는 데 쓴다.
async function loadVuNames() {
  try {
    const res = await ipc.invoke('vehicle-load-i18n');
    if (!res || !res.success || !res.names) return;
    if (window.VUSuggest) window.VUSuggest.setNames(res.names);
    autoFillLang();   // 사전이 늦게 와도 이미 적어둔 한국어가 번역되도록
    scheduleFrameSync();
  } catch (e) {
    // 오프라인·테스트 스텁 환경에서는 조용히 넘어간다(자동 주입만 생략됨).
  }
}

// 차량 카탈로그(엑셀 코드표·이베이 표에서 구운 것). 연식·차량코드·상품번호·SKU·판매가 목록.
async function loadVuVehicleCatalog() {
  try {
    const res = await ipc.invoke('vehicle-load-catalog');
    if (!res || !res.success || !res.catalog || !window.VUSuggest) return;
    window.VUSuggest.setVehicleCatalog(res.catalog);
    window.VUSuggest.refreshShell(document);
    autoFillLang();
  } catch (e) {
    // 오프라인·테스트 스텁 환경에서는 조용히 넘어간다(목록만 비어 있다).
  }
}

// 사전 조회 얇은 래퍼. 모듈이 없거나 사전이 아직 안 왔으면 null → 호출부가 경고를 띄운다.
// model* 만 인자가 2개(브랜드, 차종)라 가변인자로 받는다.
const vuJa = (kind, ...a) =>
  (window.VUSuggest && window.VUSuggest[kind + 'Ja'] ? window.VUSuggest[kind + 'Ja'](...a) : null);
const vuEn = (kind, ...a) =>
  (window.VUSuggest && window.VUSuggest[kind + 'En'] ? window.VUSuggest[kind + 'En'](...a) : null);

// 카탈로그가 없어도 세대 프리셋은 쓸 수 있으므로 먼저 붙이고, 도착하면 목록을 채운다.
if (window.VUSuggest) window.VUSuggest.bindShell(document);
loadVuCategories();
loadVuNames();
loadVuVehicleCatalog();

/* ══════════════════════════════════════════════
   DOM refs
══════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const boardBody  = $('board-body');
const logWindow  = $('log-window');
const cardArea   = $('card-area');
const emptyState = $('empty-state');
const sec8Desc   = $('sec8-desc');
const btnRun     = $('btn-run');
const btnClear   = $('btn-clear-log');

/* ══════════════════════════════════════════════
   현황판 렌더링
══════════════════════════════════════════════ */
function renderBoard() {
  boardBody.innerHTML = '';
  Object.keys(PLATFORMS).forEach(country => {
    const platforms = PLATFORMS[country];
    const tr = document.createElement('tr');

    // 나라 셀
    const tdCountry = document.createElement('td');
    tdCountry.className = 'country-cell';
    tdCountry.dataset.country = country;

    const innerCountry = document.createElement('div');
    innerCountry.className = 'country-cell-inner';

    const flagSrc = COUNTRY_FLAGS[country];
    if (flagSrc) {
      const flagImg = document.createElement('img');
      flagImg.className = 'country-flag';
      flagImg.src = flagSrc;
      flagImg.alt = '';
      innerCountry.appendChild(flagImg);
    }

    // 국기가 나라를 대신한다. 이름은 툴팁·스크린리더용으로만 남긴다.
    if (!flagSrc) {
      const nameSpan = document.createElement('span');
      nameSpan.className = 'country-name';
      nameSpan.textContent = country;
      innerCountry.appendChild(nameSpan);
    }
    tdCountry.title = country;

    tdCountry.appendChild(innerCountry);
    tr.dataset.country = country;
    tr.appendChild(tdCountry);

    // 플랫폼 셀
    TYPE_ORDER.forEach(type => {
      const plat = platforms.find(p => p.type === type);
      const td = document.createElement('td');

      if (!plat || !plat.active) {
        td.className = 'inactive-cell';
        tr.appendChild(td);
        return;
      }

      td.className = 'platform-cell';
      td.dataset.country = country;
      td.dataset.type = type;
      td.dataset.tabId = NAME_TO_TAB[plat.name] || '';

      const inner = document.createElement('div');
      inner.className = 'cell-inner';
      inner.id = `cell-${country}-${type}`;

      // 체크박스는 없앴다. 로고 타일 자체가 눌린 상태(색 + 테두리)로 선택을 보여준다.
      // 눈으로는 사라졌지만 보조기술에는 여전히 체크박스여야 하므로 role/aria 로 남긴다.
      inner.setAttribute('role', 'checkbox');
      inner.setAttribute('aria-checked', String(checked[country][type]));
      inner.setAttribute('aria-label', `${country} ${plat.name}`);
      inner.tabIndex = 0;

      // 로고가 있으면 로고, 없거나 파일이 깨졌으면 이름으로 되돌린다.
      const nameEl = document.createElement('div');
      nameEl.className = 'plat-name';
      nameEl.textContent = plat.name;

      const logoSrc = PLATFORM_LOGOS[plat.name];
      if (logoSrc) {
        const logo = document.createElement('img');
        logo.className = 'plat-logo';
        logo.src = logoSrc;
        logo.alt = plat.name;
        logo.addEventListener('error', () => logo.replaceWith(nameEl), { once: true });
        inner.appendChild(logo);
      } else {
        inner.appendChild(nameEl);
      }
      td.title = `${country} ${plat.name}`;
      td.appendChild(inner);
      tr.appendChild(td);

      // 켜고 끄기. 키보드 Space 는 이쪽만 쓴다 — role="checkbox" 는 Space 에 토글을 약속한다.
      const setCell = on => handleCheck(country, type, on, plat ? NAME_TO_TAB[plat.name] : null);

      // 클릭은 하나 더 한다: 이미 켜져 있는데 그 탭을 안 보고 있으면 끄는 대신 그 탭으로 간다.
      // 키보드는 Enter 가 이쪽이다 — 가운데 쇼핑몰 탭(켜진 몰 폼 열기)을 없앤 뒤로 그 길이 여기뿐이다.
      const clickCell = () => {
        openDetailSidebar();
        const targetTab = plat ? NAME_TO_TAB[plat.name] : null;
        const currentlyChecked = checked[country][type];

        if (currentlyChecked && targetTab) {
          const frame = $('form-frame');
          const isFrameOpen = frame && frame.style.display === 'block';
          const activeBtn = frame?.contentWindow?.document?.querySelector('.tab-btn.active');
          const activeOc = activeBtn?.getAttribute('onclick') || '';
          // 아마존 탭은 미국·일본이 같이 쓴다. 둘 다 켜져 있으면 탭이 보여도 '다른 나라 마켓' 일 수
          // 있다 — 그때 누른 것은 끄기가 아니라 그 나라 마켓으로 바꾸기다.
          const bothAmazon = !!(checked.USA?.open1 && checked.JAPAN?.open1);
          const sameMarket = targetTab !== 'amazonTab' || !bothAmazon || lastAmazonCountry === country;
          const isTabActive = activeOc.includes(`'${targetTab}'`) && sameMarket;

          if (!isFrameOpen || !isTabActive) {
            // 이미 체크되어 있지만 다른 탭을 보고 있거나 폼이 닫혀있는 경우 → 해당 탭으로 바로 전환
            openPlatformTab(targetTab, country);
            scheduleFrameSync();   // 아마존이면 마켓이 바뀌었을 수 있다
            return;
          }
        }

        setCell(!checked[country][type]);
      };

      td.addEventListener('click', clickCell);
      inner.addEventListener('keydown', e => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        e.preventDefault();
        if (e.key === 'Enter') return clickCell();
        openDetailSidebar();
        setCell(!checked[country][type]);
      });
    });

    boardBody.appendChild(tr);
    updateRowHighlight(country, tr);
  });
}

function updateRowHighlight(country, trEl) {
  let tr = trEl || boardBody.querySelector(`tr[data-country="${country}"]`);
  if (!tr) {
    // 행 직접 탐색
    Array.from(boardBody.rows).forEach(row => {
      const cc = row.querySelector('.country-cell');
      if (cc && (cc.dataset.country === country || cc.textContent.trim() === country)) tr = row;
    });
  }
  if (!tr) return;
  const anyChecked = Object.values(checked[country]).some(v => v);
  tr.classList.toggle('row-checked', anyChecked);
}

function syncCellUI(country, type) {
  const inner = document.getElementById(`cell-${country}-${type}`);
  if (!inner) return;
  inner.setAttribute('aria-checked', String(checked[country][type]));
  inner.classList.toggle('checked', checked[country][type]);
}

// 지금 폼에 띄운 몰을 현황판 칸에 표시한다(.viewing). 폼의 탭을 바꾸는 곳은 applyFilter 의 showPane
// 하나뿐이라 거기서 부른다. 아마존은 미국·일본이 탭 하나를 같이 써서, 그 탭이 지금 올리는 마켓 칸만 표시한다.
function markViewingCells(tabId) {
  document.querySelectorAll('#board-body .platform-cell').forEach(td => {
    td.classList.toggle('viewing', td.dataset.tabId === tabId &&
      (tabId !== 'amazonTab' || td.dataset.country === amazonTargetCountry()));
  });
}

   여기서는 iframe 만 따로 챙긴다: 등록 폼은 문서가 달라서 <html data-theme> 가

/* ══════════════════════════════════════════════
   언어별 표기 칸
   현황판에서 체크한 나라의 언어 칸만 보여준다. 한국어는 기준값이라 항상 보이고,
   다른 언어 칸이 비어 있으면 등록할 때 한국어가 대신 들어간다(경고와 함께).
══════════════════════════════════════════════ */
const COUNTRY_LANG = { KOREA: 'ko', USA: 'en', JAPAN: 'ja', ARAB: 'en' };

function activeLangs() {
  const langs = new Set(['ko']);
  Object.keys(PLATFORMS).forEach(country => {
    const lang = COUNTRY_LANG[country];
    if (!lang) return;
    if (PLATFORMS[country].some(p => p.active && checked[country] && checked[country][p.type])) {
      langs.add(lang);
    }
  });
  return langs;
}

function updateLangFields() {
  const langs = activeLangs();
  window.VUSuggest?.setJapanMode(langs.has('ja'), document);
  document.querySelectorAll('.lang-row').forEach(row => {
    let shown = 0;
    row.querySelectorAll('.lang-col').forEach(col => {
      const on = langs.has(col.dataset.lang);
      col.hidden = !on;
      if (on) shown += 1;
    });
    row.classList.toggle('single', shown <= 1);
  });
  autoFillLang();
}

// 쇼핑몰별 칸(SKU · 판매가 USD · Product Type · 쿠팡 상품ID)도 언어 칸과 같다 — 그 칸을 쓰는
// 몰이 현황판에서 하나라도 켜져 있을 때만 보인다. 라벨 옆 꼬리표는 지금 켜진 그 몰들이다.
const MALL_ON = {
  'imweb-us': () => !!checked.USA?.own,
  amazon:      () => !!(checked.USA?.open1 || checked.JAPAN?.open1),
  'amazon-us': () => !!checked.USA?.open1,   // 달러 판매가는 미국 아마존만(일본은 엔화를 탭에서)
  'amazon-jp': () => !!checked.JAPAN?.open1, // 수정 모드의 엔화 변경 판매가
  ebay:        () => !!checked.USA?.open2,
  naver:       () => !!checked.KOREA?.open1,
  coupang:     () => !!checked.KOREA?.open2,
};
const MALL_NAME = { 'imweb-us': '아임웹 영문', amazon: '아마존', 'amazon-us': '아마존 미국', 'amazon-jp': '아마존 일본',
                    ebay: '이베이', naver: '네이버', coupang: '쿠팡' };

function updateMallFields() {

// 아마존 Product Type 의 처음 값은 아마존 설정(amazon_config.json)에 저장된 값이다. 탭에서 좌측으로
// 옮겨 오면서 처음 값도 여기서 읽는다. 사람이 이미 고쳤으면 덮지 않는다.

// 변경 판매가(수정 모드) 목록의 국내 기준가 등급과 그 환율가. 등급표는 상품 일괄 수정 화면의 환율 자동 변경
// 설정이라 거기서 고칠 수 있다 — 칸을 열 때 다시 읽는다(1분에 한 번까지). 못 읽으면 이베이 표 판매가만 보인다.

// 자동완성 칸(SKU·판매가·변경 판매가·쿠팡 상품)의 '지금 몰 값' — 앱이 API 로 받아 둔 아마존·eBay 목록과 쿠팡 판매가
// (main 'vehicle-live-values'). 저장·동기화로 바뀌므로 칸을 열 때 다시 읽는다(1분에 한 번까지).
