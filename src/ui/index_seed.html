<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERY UP VER2 - 베리씨드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── 베리씨드 전용 스타일 ── */
        .seed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(16,185,129,0.08);
            border-bottom: 1px solid rgba(16,185,129,0.2);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }
        .seed-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            -webkit-app-region: no-drag;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .seed-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* ── 국가 탭 ── */
        .country-tabs {
            display: flex;
            gap: 4px;
            padding: 10px 20px 0;
            background: rgba(15,23,42,0.5);
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }
        .country-tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            border-radius: 6px 6px 0 0;
            white-space: nowrap;
        }
        .country-tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.04); }
        .country-tab-btn.active {
            color: #10b981;
            border-bottom-color: #10b981;
            background: rgba(16,185,129,0.08);
        }
        .country-flag { font-size: 1.1rem; }

        /* ── 국가 패널 ── */
        .country-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .country-panel.active { display: flex; }

        /* ── 서브탭 (AI / ESM) ── */
        .sub-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            background: rgba(15,23,42,0.3);
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
        }
        .sub-tab-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sub-tab-btn:hover { color: var(--text-main); }
        .sub-tab-btn.active {
            background: rgba(59,130,246,0.15);
            border-color: rgba(59,130,246,0.4);
            color: #60a5fa;
        }
        .sub-tab-btn.esm-active {
            background: rgba(139,92,246,0.15);
            border-color: rgba(139,92,246,0.4);
            color: #a78bfa;
        }

        /* ── 서브탭 콘텐츠 ── */
        .sub-pane { display: none; flex: 1; overflow-y: auto; padding: 20px; }
        .sub-pane.active { display: block; }

        /* ── AI 이미지 생성 ── */
        .layout-flex { display: flex; gap: 20px; align-items: flex-start; }
        .left-panel { flex: 1; }
        .right-panel { flex: 1; display: flex; flex-direction: column; }
        .section-title {
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--panel-border);
        }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .radio-group-row { display: flex; gap: 14px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
        .radio-label, .checkbox-label {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.83rem; color: var(--text-main); cursor: pointer;
        }
        .radio-label input[type="radio"],
        .checkbox-label input[type="checkbox"] { accent-color: #3b82f6; width: 15px; height: 15px; }
        .result-container {
            margin-top: 14px; display: none;
            background: rgba(0,0,0,0.2); padding: 14px;
            border-radius: 8px; border: 1px solid var(--panel-border);
        }
        .result-container p { font-size: 0.82rem; color: var(--text-dim); margin-top: 0; margin-bottom: 8px; }
        #aiResultImage { width: 100%; height: auto; display: block; border-radius: 4px; }
        .loader-text {
            display: none; text-align: center; margin-top: 16px;
            font-size: 0.88rem; color: #3b82f6;
            background: rgba(59,130,246,0.1); padding: 14px; border-radius: 8px;
        }
        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: #fff; border: none; font-weight: 600;
            padding: 12px; border-radius: 8px; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s; margin-top: 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-download {
            display: none; width: 100%; margin-top: 12px;
            background: #334155; color: #fff; border: none;
            padding: 10px; border-radius: 8px; font-weight: 500;
            cursor: pointer; transition: background 0.2s;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-download:hover { background: #475569; }
        .bsa-instruction {
            display: none; color: #fff; background: #ef4444;
            padding: 10px; border-radius: 8px; font-weight: bold;
            font-size: 0.95rem; margin-bottom: 12px; text-align: center;
        }
        .bsa-size-control {
            display: none; margin-top: 12px; text-align: center;
            background: var(--panel-bg); padding: 10px;
            border-radius: 8px; border: 1px solid var(--panel-border);
        }

        /* ── ESM 탭 ── */
        .esm-panel { max-width: 600px; }
        .category-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
        .toggle-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: transparent; color: var(--text-dim);
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .toggle-btn.active {
            background: rgba(139,92,246,0.15);
            border-color: #8b5cf6; color: #a78bfa;
        }
        .file-upload-box {
            border: 2px dashed var(--panel-border); border-radius: 8px;
            padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.2s; min-height: 80px;
            display: flex; align-items: center; justify-content: center;
        }
        .file-upload-box:hover { border-color: #8b5cf6; background: rgba(139,92,246,0.05); }
        .upload-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-dim); font-size: 0.82rem; }
        .image-preview { max-width: 100%; border-radius: 4px; }
        .path-display {
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
            background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px;
            font-size: 0.8rem;
        }
        .path-segment { color: #60a5fa; font-weight: 500; }
        .path-arrow { color: var(--text-dim); }
        .folder-list-area { display: flex; gap: 8px; align-items: center; }
        .folder-list-area select { flex: 1; }
        .html-output-area { position: relative; }
        .btn-copy {
            position: absolute; top: 6px; right: 6px;
            background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
            color: #60a5fa; padding: 4px 10px; border-radius: 6px;
            cursor: pointer; font-size: 0.78rem; display: flex; align-items: center; gap: 4px;
        }
        .btn-copy:hover { background: rgba(59,130,246,0.3); }
        .log-container { margin-top: 16px; }
        .log-header h3 { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
        .log-window {
            background: rgba(0,0,0,0.3); border-radius: 6px;
            border: 1px solid var(--panel-border);
            padding: 8px; height: 120px; overflow-y: auto; font-size: 0.78rem;
        }
        .log-entry { padding: 2px 0; }
        .log-entry.system { color: var(--text-dim); }
        .log-entry.success { color: #34d399; }
        .log-entry.error { color: #f87171; }
        .log-entry.process { color: #60a5fa; }

        /* ── 국가 배지 ── */
        .country-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2);
            color: #34d399; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem;
        }

        /* ── 드래그 가능 BSA 로고 ── */
        .ai-image-wrapper { position: relative; display: inline-block; width: 100%; border: 1px solid var(--panel-border); border-radius: 4px; overflow: hidden; }
        .draggable-bsa { position: absolute; cursor: grab; user-select: none; z-index: 10; }
        .draggable-bsa:active { cursor: grabbing; }
    </style>
</head>
<body>
<div style="display:flex; flex-direction:column; height:100vh; overflow:hidden;">

    <!-- 헤더 -->
    <div class="seed-header">
        <div class="seed-header-left">
            <button class="back-btn" onclick="goBack()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                런처로
            </button>
            <span class="seed-title">✦ 베리씨드</span>
        </div>
        <span style="font-size:0.75rem; color:var(--text-dim);">AI 이미지 생성 &amp; ESM 이미지 호스팅</span>
    </div>

    <!-- 국가 탭 네비게이션 -->
    <div class="country-tabs">
        <button class="country-tab-btn active" onclick="switchCountry('KOREA', this)">
            <span class="country-flag">🇰🇷</span> KOREA
        </button>
        <button class="country-tab-btn" onclick="switchCountry('USA', this)">
            <span class="country-flag">🇺🇸</span> USA
        </button>
        <button class="country-tab-btn" onclick="switchCountry('JAPAN', this)">
            <span class="country-flag">🇯🇵</span> JAPAN
        </button>
        <button class="country-tab-btn" onclick="switchCountry('ARAB', this)">
            <span class="country-flag">🇦🇪</span> ARAB
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- KOREA 패널 -->
    <!-- ============================================================ -->
    <div class="country-panel active" id="panel_KOREA">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="sub_ai_KOREA" onclick="switchSub('KOREA','ai',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/></svg>
                AI 이미지 생성
            </button>
            <button class="sub-tab-btn" id="sub_esm_KOREA" onclick="switchSub('KOREA','esm',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ESM 이미지 호스팅
            </button>
            <span class="country-badge" style="margin-left:auto;">🇰🇷 KOREA</span>
        </div>
        <div class="sub-pane active" id="ai_KOREA">
            <!-- AI 이미지 생성 공통 컴포넌트 -->
            <div data-ai-panel="KOREA"></div>
        </div>
        <div class="sub-pane" id="esm_KOREA">
            <div data-esm-panel="KOREA"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- USA 패널 -->
    <!-- ============================================================ -->
    <div class="country-panel" id="panel_USA">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="sub_ai_USA" onclick="switchSub('USA','ai',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/></svg>
                AI 이미지 생성
            </button>
            <button class="sub-tab-btn" id="sub_esm_USA" onclick="switchSub('USA','esm',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ESM 이미지 호스팅
            </button>
            <span class="country-badge" style="margin-left:auto;">🇺🇸 USA</span>
        </div>
        <div class="sub-pane active" id="ai_USA">
            <div data-ai-panel="USA"></div>
        </div>
        <div class="sub-pane" id="esm_USA">
            <div data-esm-panel="USA"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAPAN 패널 -->
    <!-- ============================================================ -->
    <div class="country-panel" id="panel_JAPAN">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="sub_ai_JAPAN" onclick="switchSub('JAPAN','ai',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/></svg>
                AI 이미지 생성
            </button>
            <button class="sub-tab-btn" id="sub_esm_JAPAN" onclick="switchSub('JAPAN','esm',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ESM 이미지 호스팅
            </button>
            <span class="country-badge" style="margin-left:auto;">🇯🇵 JAPAN</span>
        </div>
        <div class="sub-pane active" id="ai_JAPAN">
            <div data-ai-panel="JAPAN"></div>
        </div>
        <div class="sub-pane" id="esm_JAPAN">
            <div data-esm-panel="JAPAN"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ARAB 패널 -->
    <!-- ============================================================ -->
    <div class="country-panel" id="panel_ARAB">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="sub_ai_ARAB" onclick="switchSub('ARAB','ai',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/></svg>
                AI 이미지 생성
            </button>
            <button class="sub-tab-btn" id="sub_esm_ARAB" onclick="switchSub('ARAB','esm',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ESM 이미지 호스팅
            </button>
            <span class="country-badge" style="margin-left:auto;">🇦🇪 ARAB</span>
        </div>
        <div class="sub-pane active" id="ai_ARAB">
            <div data-ai-panel="ARAB"></div>
        </div>
        <div class="sub-pane" id="esm_ARAB">
            <div data-esm-panel="ARAB"></div>
        </div>
    </div>

</div><!-- end flex container -->

<script>
const { ipcRenderer } = require('electron');

// ── 국가별 템플릿 config (나중에 국가별로 다른 디자인 적용 예정) ──
const COUNTRY_TEMPLATES = {
    KOREA: { lang: 'ko', esmCats: ['자동차', '오토바이'] },
    USA:   { lang: 'en', esmCats: ['Car', 'Motorcycle'] },
    JAPAN: { lang: 'ja', esmCats: ['自動車', 'バイク'] },
    ARAB:  { lang: 'ar', esmCats: ['Car', 'Motorcycle'] },
};

// ── 국가별 상태 관리 ──
const state = {};
['KOREA','USA','JAPAN','ARAB'].forEach(c => {
    state[c] = {
        esmImagePath: '',
        esmCategory: COUNTRY_TEMPLATES[c].esmCats[0],
        selectedFolder: '',
        lastEsmUrl: '',
    };
});

let activeCountry = 'KOREA';

// ── 탭 전환 ──
function switchCountry(country, btn) {
    document.querySelectorAll('.country-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.country-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel_' + country).classList.add('active');
    btn.classList.add('active');
    activeCountry = country;
}

function switchSub(country, sub, btn) {
    const panel = document.getElementById('panel_' + country);
    panel.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
    panel.querySelectorAll('.sub-tab-btn').forEach(b => {
        b.classList.remove('active', 'esm-active');
    });
    document.getElementById(sub + '_' + country).classList.add('active');
    btn.classList.add(sub === 'esm' ? 'esm-active' : 'active');
}

// ── 뒤로가기 ──
function goBack() {
    ipcRenderer.send('close-app');
}

// ── AI 이미지 생성 패널 HTML 생성 ──
function buildAiPanel(country) {
    return `
    <form id="aiForm_${country}" onsubmit="submitAi(event,'${country}')">
      <div class="layout-flex">
        <!-- 왼쪽: 텍스트 정보 -->
        <div class="left-panel">
          <h3 class="section-title">1. 텍스트 정보 입력</h3>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">제조사 (브랜드)</label>
              <input type="text" name="brand" placeholder="예: 벤츠" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">차종 (모델명)</label>
              <input type="text" name="carClass" placeholder="예: B클래스" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">상품번호 (No.)</label>
              <input type="text" name="no" placeholder="예: 322" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">세대</label>
              <input type="text" name="gen" placeholder="예: 1세대 전기형" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">연식</label>
              <input type="text" name="year" placeholder="예: 06.10~09.08" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">코드</label>
              <input type="text" name="code" placeholder="예: W245" class="form-input">
            </div>
            <div class="form-group" style="grid-column:span 2;">
              <label class="form-label">BSA 가능 여부</label>
              <div class="radio-group-row">
                <label class="radio-label"><input type="radio" name="bsaType_${country}" value="none" checked> BSA 없음</label>
                <label class="radio-label"><input type="radio" name="bsaType_${country}" value="bsa"> BSA 가능</label>
                <label class="radio-label"><input type="radio" name="bsaType_${country}" value="bsaOption"> BSA 선택옵션</label>
              </div>
            </div>
          </div>
          <div class="form-group" style="margin-top:12px;">
            <label class="checkbox-label">
              <input type="checkbox" name="includeLogo" checked>
              <span>OPTIC-GLASS 로고 포함하기 (가운데 워터마크)</span>
            </label>
          </div>
        </div>

        <!-- 오른쪽: 거울 업로드 및 처리 -->
        <div class="right-panel">
          <h3 class="section-title">2. 거울 업로드 및 처리</h3>
          <div class="form-group">
            <label class="form-label">거울 방향 선택</label>
            <select name="mirrorSide" class="form-input" required>
              <option value="driver">운전석 1개만 업로드 (조수석 자동 반전 생성)</option>
              <option value="passenger">조수석 1개만 업로드 (운전석 자동 반전 생성)</option>
              <option value="both">양쪽 거울이 모두 포함된 1개 사진 업로드</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">거울 사진</label>
            <input type="file" name="mirror" accept="image/*" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">처리 모드 선택</label>
            <div class="radio-group-row">

// ── 패널 동적 렌더링 ──
function renderPanels() {
    ['KOREA','USA','JAPAN','ARAB'].forEach(c => {
        document.querySelector(`[data-ai-panel="${c}"]`).outerHTML = buildAiPanel(c);
        document.querySelector(`[data-esm-panel="${c}"]`).outerHTML = buildEsmPanel(c);
    });
    // BSA 슬라이더 및 드래그 초기화
    ['KOREA','USA','JAPAN','ARAB'].forEach(c => initCountry(c));
}

function initCountry(country) {
    // BSA 슬라이더
    const slider = document.getElementById(`bsaSlider_${country}`);
    const sliderVal = document.getElementById(`bsaSliderVal_${country}`);
    const bsaLogo = document.getElementById(`bsaLogo_${country}`);
    if (slider) {
        slider.addEventListener('input', () => {
            sliderVal.textContent = slider.value + '%';
            if (bsaLogo) bsaLogo.style.width = slider.value + '%';
        });
    }
    // BSA 드래그
    if (bsaLogo) {
        const wrapper = document.getElementById(`aiWrapper_${country}`);
        let dragging = false;
        bsaLogo.addEventListener('mousedown', e => {
            e.preventDefault(); dragging = true;
            const rect = bsaLogo.getBoundingClientRect();
            const shiftX = e.clientX - rect.left;
            const shiftY = e.clientY - rect.top;
            const onMove = ev => {
                if (!dragging) return;
                const wr = wrapper.getBoundingClientRect();
                let nx = ev.clientX - shiftX - wr.left;
                let ny = ev.clientY - shiftY - wr.top;
                nx = Math.max(0, Math.min(nx, wr.width - bsaLogo.offsetWidth));
                ny = Math.max(0, Math.min(ny, wr.height - bsaLogo.offsetHeight));
                bsaLogo.style.left = (nx / wr.width * 100) + '%';
                bsaLogo.style.top = (ny / wr.height * 100) + '%';
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', () => { dragging = false; document.removeEventListener('mousemove', onMove); }, { once: true });
        });
        bsaLogo.ondragstart = () => false;
    }
}

// ── AI 이미지 생성 제출 ──
async function submitAi(e, country) {
    e.preventDefault();
    const form = e.target;
    const brand     = form.brand.value.trim();
    const carClass  = form.carClass.value.trim();
    const no        = form.no.value.trim();
    const gen       = form.gen.value.trim();
    const year      = form.year.value.trim();
    const code      = form.code.value.trim();
    const includeLogo = form.includeLogo.checked;
    const mirrorSide  = form.mirrorSide.value;
    const skipAIValue = form.querySelector(`input[name="skipAI_${country}"]:checked`).value === 'on';
    const bsaType     = form.querySelector(`input[name="bsaType_${country}"]:checked`).value;
    const mirrorFileInput = form.mirror;
    if (!mirrorFileInput.files.length) { alert('거울 사진을 업로드해주세요.'); return; }
    const mirrorPath = mirrorFileInput.files[0].path;

    const submitBtn = document.getElementById(`aiSubmitBtn_${country}`);
    const loader    = document.getElementById(`aiLoader_${country}`);
    const resultBox = document.getElementById(`aiResult_${country}`);
    const resultImg = document.getElementById(`aiResultImg_${country}`);
    const dlBtn     = document.getElementById(`aiDownload_${country}`);

    submitBtn.disabled = true;
    submitBtn.textContent = '생성 중...';
    loader.style.display = 'block';
    resultBox.style.display = 'none';

    try {
        const result = await ipcRenderer.invoke('generate-ai-image', {
            brand, carClass, no, gen, year, code,
            includeLogo, mirrorSide, skipAI: skipAIValue, bsaType, mirrorPath,
            manualBsa: true, country
        });
        if (!result.success) throw new Error(result.error || '알 수 없는 오류');

        const imageUrl = `data:image/jpeg;base64,${result.base64}`;
        resultImg.src = imageUrl;
        resultBox.style.display = 'block';

        const bsaLogo = document.getElementById(`bsaLogo_${country}`);
        const bsaInst = document.getElementById(`bsaInstruction_${country}`);
        const bsaSize = document.getElementById(`bsaSize_${country}`);
        if (bsaType === 'bsa' || bsaType === 'bsaOption') {
            bsaLogo.src = bsaType === 'bsaOption' ? '../../data/bsa_option_logo.png' : '../../data/bsa_logo.png';
            bsaLogo.style.display = 'block';
            bsaLogo.style.top = '60%'; bsaLogo.style.left = '15%'; bsaLogo.style.width = '15%';
            bsaInst.style.display = 'block';
            bsaSize.style.display = 'block';
        } else {
            bsaLogo.style.display = 'none';
            bsaInst.style.display = 'none';
            bsaSize.style.display = 'none';
        }

        // ESM 파일명 자동 채우기
        const esmNameInput = document.getElementById(`esmFileName_${country}`);
        if (esmNameInput) esmNameInput.value = `OPTICGLASS_${brand}_${mirrorSide === 'passenger' ? '조수석' : '운전석'}`;

        dlBtn.style.display = 'flex';
        dlBtn.onclick = () => downloadAiImage(country, brand, carClass, bsaType, imageUrl);

    } catch (err) {
        alert('오류: ' + err.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> 이미지 생성하기';
        loader.style.display = 'none';
    }
}

// ── 다운로드 (BSA 합성) ──
function downloadAiImage(country, brand, carClass, bsaType, imageUrl) {
    const bsaLogo = document.getElementById(`bsaLogo_${country}`);
    const wrapper = document.getElementById(`aiWrapper_${country}`);
    const fileName = `OPTICGLASS_${brand}_${carClass || '이미지'}.jpg`;
    if (bsaType === 'bsa' || bsaType === 'bsaOption') {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const bImg = new Image();
            bImg.onload = () => {
                const lp = parseFloat(bsaLogo.style.left) / 100;
                const tp = parseFloat(bsaLogo.style.top) / 100;
                const wp = parseFloat(bsaLogo.style.width) / 100;
                const tw = img.width * wp;
                const th = bImg.height * (tw / bImg.width);
                ctx.drawImage(bImg, img.width * lp, img.height * tp, tw, th);
                const merged = canvas.toDataURL('image/jpeg', 0.95);
                ipcRenderer.invoke('save-merged-image', { base64Data: merged }).then(() => {
                    const a = document.createElement('a'); a.download = fileName; a.href = merged; a.click();
                });
            };
            bImg.src = bsaType === 'bsaOption' ? '../../data/bsa_option_logo.png' : '../../data/bsa_logo.png';
        };
        img.src = imageUrl;
    } else {
        ipcRenderer.invoke('save-merged-image', { base64Data: imageUrl }).then(() => {
            const a = document.createElement('a'); a.download = fileName; a.href = imageUrl; a.click();
        });
    }
}

// ── ESM 함수 ──
function esmLog(country, msg, type = 'info') {
    const log = document.getElementById(`esmLog_${country}`);
    if (!log) return;
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    div.textContent = `[${t}] ${msg}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function setEsmCat(country, cat, idx) {
    state[country].esmCategory = cat;
    const cats = COUNTRY_TEMPLATES[country].esmCats;
    cats.forEach((_, i) => {
        const btn = document.getElementById(`esmCatBtn_${country}_${i}`);
        if (btn) btn.classList.toggle('active', i === idx);
    });
    const pathCat = document.getElementById(`esmPathCat_${country}`);
    if (pathCat) pathCat.textContent = cat;
    // 폴더 리셋
    const sel = document.getElementById(`esmFolderSelect_${country}`);
    if (sel) { sel.innerHTML = '<option value="">-- 폴더를 조회해주세요 --</option>'; sel.disabled = true; }
    state[country].selectedFolder = '';
    updateEsmUploadBtn(country);
}

function updateEsmUploadBtn(country) {
    const btn = document.getElementById(`esmUploadBtn_${country}`);
    if (btn) btn.disabled = !state[country].esmImagePath;
}

async function loginESM_seed(country) {
    esmLog(country, 'ESM Plus 로그인 창을 엽니다...', 'system');
    const result = await ipcRenderer.invoke('esm-login');
    if (result.success) esmLog(country, '✓ ESM 로그인 성공!', 'success');
    else esmLog(country, `로그인 실패: ${result.error}`, 'error');
}

async function selectEsmImg(country) {
    const result = await ipcRenderer.invoke('select-file', {
        filters: [{ name: 'Images', extensions: ['jpg','jpeg','png','gif','bmp','webp'] }]
    });
    if (result.canceled) return;
    state[country].esmImagePath = result.filePath;
    const fileName = result.filePath.split(/[/\\]/).pop();
    const label = document.getElementById(`esmFileLabel_${country}`);
    if (label) label.textContent = fileName;
    const preview = document.getElementById(`esmPreview_${country}`);
    if (preview) { preview.src = `file://${result.filePath}`; preview.style.display = 'block'; }
    esmLog(country, `이미지 선택: ${fileName}`, 'success');
    updateEsmUploadBtn(country);
}

async function loadAutoImg(country) {
    const nameInput = document.getElementById(`esmFileName_${country}`);
    const customName = (nameInput && nameInput.value.trim()) || 'OPTICGLASS_생성이미지';
    const result = await ipcRenderer.invoke('load-auto-image', customName);
    if (!result.success) { esmLog(country, result.error, 'error'); alert(result.error); return; }
    state[country].esmImagePath = result.filePath;
    const label = document.getElementById(`esmFileLabel_${country}`);
    if (label) label.textContent = customName + '.jpg';
    const preview = document.getElementById(`esmPreview_${country}`);
    if (preview) { preview.src = `file://${result.filePath}?t=${Date.now()}`; preview.style.display = 'block'; }
    esmLog(country, `자동 생성 이미지 불러오기 성공: ${customName}.jpg`, 'success');
    updateEsmUploadBtn(country);
}

async function loadEsmFolders(country) {
    esmLog(country, `${state[country].esmCategory} 폴더 조회 시작...`, 'process');
    const result = await ipcRenderer.invoke('esm-list-folders', { category: state[country].esmCategory });
    const sel = document.getElementById(`esmFolderSelect_${country}`);
    if (!sel) return;
    if (result.success) {
        sel.innerHTML = '<option value="">-- 폴더를 선택하세요 --</option>';
        if (!result.folders.length) {
            sel.innerHTML = '<option value="">(현재 폴더에 업로드)</option>';
            esmLog(country, '하위 폴더 없음.', 'system');
        } else {
            result.folders.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name; opt.textContent = '📁 ' + f.name;
                sel.appendChild(opt);
            });
            esmLog(country, `${result.folders.length}개 폴더 발견`, 'success');
        }
        sel.disabled = false;
        sel.onchange = () => { state[country].selectedFolder = sel.value; updateEsmUploadBtn(country); };
    } else {
        esmLog(country, `폴더 조회 실패: ${result.error}`, 'error');
    }
}

async function uploadESM_seed(country) {
    if (!state[country].esmImagePath) { esmLog(country, '이미지를 선택해주세요.', 'error'); return; }
    const btn = document.getElementById(`esmUploadBtn_${country}`);
    btn.disabled = true; btn.textContent = '업로드 중...';
    esmLog(country, `업로드 시작: ${state[country].esmCategory} > ${state[country].selectedFolder || '(루트)'}`, 'process');
    const result = await ipcRenderer.invoke('esm-upload', {
        filePath: state[country].esmImagePath,
        category: state[country].esmCategory,
        targetFolder: state[country].selectedFolder
    });
    btn.disabled = false; btn.textContent = '업로드';
    if (result.success) {
        esmLog(country, '✓ 업로드 성공!', 'success');
        const htmlOut = document.getElementById(`esmHtmlOut_${country}`);
        const copyBtn = document.getElementById(`esmCopyBtn_${country}`);
        if (htmlOut) { htmlOut.value = result.html; }
        if (copyBtn) copyBtn.style.display = 'flex';
        state[country].lastEsmUrl = result.url;
        esmLog(country, `URL: ${result.url}`, 'system');
    } else {
        esmLog(country, `업로드 실패: ${result.error}`, 'error');
    }
}

function copyEsmHtml(country) {
    const ta = document.getElementById(`esmHtmlOut_${country}`);
    if (!ta) return;
    ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch { document.execCommand('copy'); }
    const btn = document.getElementById(`esmCopyBtn_${country}`);
    if (btn) {
        btn.textContent = '✓ 복사됨!';
        setTimeout(() => { btn.textContent = '복사'; }, 2000);
    }
}

// ── 초기화 ──
renderPanels();
</script>
