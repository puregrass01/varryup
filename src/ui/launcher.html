<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERY UP VER3 - 런처</title>
    <meta name="description" content="베리씨드, 베리업, 베리맵 가운데 시작할 프로그램을 고르는 VERY UP 런처">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="launcher.css">
</head>
<body>
    <!-- 커스텀 윈도우 컨트롤 -->
    <div class="win-bar">
        <span class="win-title wordmark">VERY UP VER3</span>
        <div class="win-btns">
            <button type="button" class="win-btn" data-theme-toggle title="밝게 / 어둡게"></button>
            <button type="button" class="win-btn" onclick="const {ipcRenderer}=require('electron');ipcRenderer.send('minimize-win')" title="최소화" aria-label="최소화">─</button>
            <button type="button" class="win-btn win-close" onclick="const {ipcRenderer}=require('electron');ipcRenderer.send('close-win')" title="닫기" aria-label="닫기">✕</button>
        </div>
    </div>
    <!-- 직원 로그인 오버레이 (로그인 전엔 이 화면이 카드를 가린다) -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card vu-cut">
            <div class="login-brand">
                <div class="login-brand-name">VERY UP</div>
                <div class="login-brand-sub">직원 로그인</div>
            </div>
            <div class="login-form">
                <input id="li_user" class="login-input" placeholder="아이디" autocomplete="username">
                <input id="li_pw" class="login-input" type="password" placeholder="비밀번호" autocomplete="current-password">
                <button id="li_btn" class="login-btn vu-key vu-key-accent" onclick="doLogin()">로그인</button>
                <div id="li_err" class="login-err" style="display:none;"></div>
                <!-- 관리자 서버(직원·인증키·로그)를 기본 브라우저로 연다. 주소는 메인 프로세스가 만든다. -->
                <button id="li_server" class="login-alt" onclick="openAdminServer()" title="관리자 서버 로그인 페이지를 브라우저로 엽니다">
                    서버 열기
                </button>
                <!-- 서버에 닿지 못했을 때만 나타난다. 비밀번호가 틀린 경우에는 뜨지 않는다. -->
                <button id="li_local" class="login-alt" onclick="enterLocalMode()" style="display:none;">
                    서버 없이 로컬 모드로 시작
                </button>
                <div id="li_localhint" class="login-hint" style="display:none;">
                    각 플랫폼 탭에서 직접 입력한 API 키로 동작합니다.
                </div>
            </div>
        </div>
    </div>

    <div class="launcher-bg">
        <div class="launcher-wrap">
            <!-- 로고 -->
            <div class="launcher-logo">
                <h1>VERY UP</h1>
                <span class="ver-badge">VER 3.0</span>
            </div>
            <p class="launcher-sub">시작할 프로그램을 선택하세요</p>

            <!-- 버튼 카드 영역 -->
            <div class="card-grid">

                <!-- 베리씨드 카드 -->
                <button class="app-card seed-card vu-cut" onclick="launchSeed()">
                    <div class="card-icon seed-icon">
                        <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 22V12"/>
                            <path d="M12 12C12 7 7 4 2 4c0 5 3 9 10 8"/>
                            <path d="M12 12c0-5 5-8 10-8 0 5-3 9-10 8"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <h2>베리씨드</h2>
                        <p><abbr>AI</abbr> 이미지 생성 &amp; <abbr>ESM</abbr> 이미지 호스팅</p>
                        <ul class="card-features">
                            <li>한국, 미국, 일본, 아랍</li>
                            <li>국가별 템플릿 이미지 생성</li>
                        </ul>
                    </div>
                    <div class="card-arrow" aria-hidden="true">→</div>
                </button>

                <!-- 베리업 카드 -->
                <button class="app-card up-card vu-cut" onclick="launchUp()">
                    <div class="card-icon up-icon">
                        <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="7.5 4.21 12 6.81 16.5 4.21"/>
                            <polyline points="7.5 19.79 7.5 14.6 3 12"/>
                            <polyline points="21 12 16.5 14.6 16.5 19.79"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <h2>베리업</h2>
                        <p>멀티 플랫폼 상품 등록 &amp; 수정 관리</p>
                        <ul class="card-features">
                            <li>신규 등록 / 상품 수정 모드</li>
                            <li>국가 × 플랫폼 현황판</li>
                            <li>한국, 미국, 일본, 아랍</li>
                        </ul>
                    </div>
                    <div class="card-arrow" aria-hidden="true">→</div>
                </button>

                <!-- 베리맵 카드 -->
                <button class="app-card map-card vu-cut" onclick="launchMap()">
                    <div class="card-icon map-icon">
                        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21 1 6"/>
                            <line x1="8" y1="3" x2="8" y2="18"/>
                            <line x1="16" y1="6" x2="16" y2="21"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <h2>베리맵</h2>
                        <p>차종 코드표 ↔ 채널 등록 현황 대조</p>
                    </div>
                    <div class="card-arrow" aria-hidden="true">→</div>
                </button>

            </div>

            <p class="launcher-footer">VERY UP VER3 &nbsp;·&nbsp; Optic Glass Commerce Automation</p>
        </div>
    </div>

    <script>
        VUTheme.init();   // 테마 값·버튼은 theme.js 소유
        const { ipcRenderer } = require('electron');

        function showErr(m) {
            const e = document.getElementById('li_err');
            e.textContent = m; e.style.display = 'block';
        }
        async function doLogin() {
            const btn = document.getElementById('li_btn');
            const err = document.getElementById('li_err');
            const username = document.getElementById('li_user').value.trim();
            const password = document.getElementById('li_pw').value;
            if (!username || !password) { showErr('아이디와 비밀번호를 입력하세요.'); return; }
            btn.disabled = true; btn.textContent = '로그인 중...'; err.style.display = 'none';
            try {
                const res = await ipcRenderer.invoke('server-login', { username, password });
                if (res && res.ok) {
                    hideOverlay();
                } else {
                    showErr((res && res.error) || '로그인에 실패했습니다.');
                    // 서버 자체에 닿지 못한 경우에만 로컬 모드를 제안한다.
                    if (res && res.offline) offerLocalMode();
                }
            } catch (e) {
                showErr('서버에 연결할 수 없습니다.');
                offerLocalMode();
            } finally {
                btn.disabled = false; btn.textContent = '로그인';
            }
        }

        function hideOverlay() {
            document.getElementById('loginOverlay').style.display = 'none';
        }
        async function openAdminServer() {
            const btn = document.getElementById('li_server');
            btn.disabled = true;
            try {
                const res = await ipcRenderer.invoke('open-admin-server');
                if (!res || !res.ok) showErr((res && res.error) || '서버 주소를 열 수 없습니다.');
            } catch (e) {
                showErr('서버를 열지 못했습니다.');
            } finally {
                btn.disabled = false;
            }
        }
        function offerLocalMode() {
            document.getElementById('li_local').style.display = 'block';
            document.getElementById('li_localhint').style.display = 'block';
        }
        async function enterLocalMode() {
            try { await ipcRenderer.invoke('enter-local-mode'); } catch (e) { /* 실패해도 진입은 시킨다 */ }
            hideOverlay();
        }

        // 서버를 아예 안 쓰는 배포(ADMIN_SERVER_URL 미설정 또는 VERYUP_LOCAL_ONLY=1)면
        // 로그인 화면을 띄우지 않고 바로 들어간다.
        (async () => {
            try {
                const mode = await ipcRenderer.invoke('server-mode');
                // 서버 주소가 없으면 "서버 열기" 는 열 곳이 없다.
                if (mode && !mode.adminServer) document.getElementById('li_server').style.display = 'none';
                if (mode && mode.loginRequired === false) {
                    await ipcRenderer.invoke('enter-local-mode');
                    hideOverlay();
                }
            } catch (e) { /* 핸들러가 없으면 기존처럼 로그인 화면을 유지한다 */ }
        })();
        // 로그인 화면에서 엔터로 제출
        document.addEventListener('keydown', (e) => {
            const ov = document.getElementById('loginOverlay');
            if (e.key === 'Enter' && ov && ov.style.display !== 'none') doLogin();
        });

        function launchSeed() {
            ipcRenderer.send('launch-app', 'seed');
        }
        function launchMap() {
            ipcRenderer.send('launch-app', 'map');
        }
        function launchUp() {
            ipcRenderer.send('launch-app', 'up');
        }
    </script>
</body>
</html>
