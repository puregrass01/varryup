{% extends "base.html" %}
{% block title %}비밀번호 변경 · VERY UP 관리자{% endblock %}
{% block body %}
<h1>비밀번호 변경</h1>
<p class="sub">{{ user["name"] }}({{ user["username"] }}) 님의 로그인 비밀번호를 변경합니다.</p>

{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% if err %}<div class="msg" style="background:var(--danger-soft);color:var(--danger);border-color:var(--danger)">{{ err }}</div>{% endif %}

<div class="card" style="max-width:440px">
  <form method="post" action="/password" style="display:flex;flex-direction:column;gap:14px">
    <div>
      <label>현재 비밀번호</label>
      <input name="current" type="password" autocomplete="current-password" required>
    </div>
    <div>
      <label>새 비밀번호 (6자 이상)</label>
      <input name="new1" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <div>
      <label>새 비밀번호 확인</label>
      <input name="new2" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <button class="btn" type="submit" style="margin-top:4px">비밀번호 변경</button>
  </form>
</div>
{% endblock %}
